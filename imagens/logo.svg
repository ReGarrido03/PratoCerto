<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Prato Certo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- fundo -->
  <circle cx="32" cy="32" r="30" fill="#2F5D3A"/>

  <!-- chapéu de chefe, servindo de tampa da panela -->
  <g fill="#F1F3EC">
    <circle cx="24.5" cy="23" r="6.8"/>
    <circle cx="32" cy="19" r="8.2"/>
    <circle cx="39.5" cy="23" r="6.8"/>
    <rect x="24" y="25.5" width="16" height="8" rx="1.5"/>
  </g>

  <!-- alças da panela -->
  <rect x="12.5" y="38" width="6" height="4" rx="2" fill="#E3A81F"/>
  <rect x="45.5" y="38" width="6" height="4" rx="2" fill="#E3A81F"/>

  <!-- borda e corpo da panela -->
  <rect x="16.5" y="33.5" width="31" height="4.5" rx="2" fill="#E3A81F"/>
  <path d="M19.5 38 H44.5 L41.8 48.5 Q41.3 50.5 39.3 50.5 H24.7 Q22.7 50.5 22.2 48.5 Z"
        fill="#E3A81F"/>

  <!-- vapor saindo da panela, à direita do chapéu -->
  <path d="M46.5 26 q2.5 -2.5 0 -5 q-2.5 -2.5 0 -5"
        fill="none" stroke="#F1F3EC" stroke-width="2" stroke-linecap="round" opacity="0.75"/>

</svg>
